# Brainfactory MES v1 - Render Blueprint
# Dashboard -> New -> Blueprint -> kenfuliang/Muse_playground

databases:
  - name: brainfactory-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: brainfactory-api
    runtime: node
    plan: free
    healthCheckPath: /api/health
    buildCommand: >-
      npm i -g bun &&
      bun install &&
      bun run --cwd packages/shared build &&
      bun run --cwd packages/db build &&
      bun run --cwd packages/ui build &&
      bun run --cwd apps/api build
    startCommand: >-
      export PATH="$(npm root -g)/.bin:$PATH" &&
      cd packages/db && bun x prisma migrate deploy && cd ../.. &&
      node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brainfactory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

  - type: web
    name: brainfactory-web
    runtime: static
    plan: free
    buildCommand: >-
      npm i -g bun &&
      bun install &&
      bun run --cwd packages/shared build &&
      bun run --cwd packages/ui build &&
      cd apps/web && VITE_API_URL="https://$BRAINFACTORY_API_HOST/api" bun run build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BRAINFACTORY_API_HOST
        fromService:
          type: web
          name: brainfactory-api
          property: host
