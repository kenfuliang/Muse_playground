# Render blueprint — one-click infra for Brainfactory v1 trial.
# Connect this repo in Render Dashboard -> New -> Blueprint, set env vars once.

services:
  - type: web
    name: brainfactory-api
    env: node
    plan: starter
    buildCommand: npm ci && npm run db:generate && npm run build -w packages/shared && npm run build -w packages/db && npm run build -w apps/api
    startCommand: npm run db:migrate --prefix packages/db 2>/dev/null; node apps/api/dist/main.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: brainfactory-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
    healthCheckPath: /api/health

  - type: web
    name: brainfactory-web
    env: static
    plan: starter
    buildCommand: npm ci && npm run build -w packages/shared && npm run build -w packages/ui && npm run build -w apps/web
    staticPublishPath: apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://brainfactory-api.onrender.com/api

databases:
  - name: brainfactory-db
    plan: starter
